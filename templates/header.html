<header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between p-3 mb-4 border-bottom">
<a href="{% url 'home' %}" class="text-black text-decoration-none"><span class="fs-4">Seminar</span></a>
  <ul class="nav col-md-auto mb-2 justify-content-center mb-md-0">
    <li><a href="{% url 'home' %}" class="nav-link px-2">Home</a></li>
    <li><a href="{% url 'new_seminar' %}" class="nav-link px-2">Create Seminar</a></li>
    <li><a href="{% url 'seminar_list' %}" class="nav-link px-2">Seminar List</a></li>
    <li>
      <div class="dropdown">
        <a class="nav-link px-2 dropdown-toggle" href="" role="button" data-bs-toggle="dropdown" aria-expanded="false">Categories</a>

        <ul class="dropdown-menu">
          {% for category in categories %}
          <li><a class="dropdown-item {% if current_category.id == category.id %}active{% endif %}" href="{% url 'seminar_list' %}?category={{ category.id }}">{{ category.name }}</a></li>
          {% endfor %}
        </ul>
    </div>
    </li>
  </ul>
  <div class="text-end">
    {% if user.is_authenticated %}
    <a class="nav-item me-2">{{ user.username }}</a>
    <a href="{% url 'logout' %}" class="btn btn-outline-primary">Logout</a>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>
    <a href="{% url 'register' %}" class="btn btn-primary">Sign-up</a>
    {% endif %}
  </div>
</header>
