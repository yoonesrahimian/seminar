<main>
  <div class="container">
    <header
    class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom"
    >
    <span class="fs-4">Seminar</span>
      <div class="col-md-3 mb-2 mb-md-0">
        <a
          href="/"
          class="d-inline-flex link-body-emphasis text-decoration-none"
        >
          <svg
            class="bi"
            width="40"
            height="32"
            role="img"
            aria-label="Bootstrap"
          >
            <use xlink:href="#bootstrap"></use>
          </svg>
        </a>
      </div>
      <ul
        class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0"
      >
        <li><a href="{% url 'home' %}" class="nav-link px-2">Home</a></li>
        <li><a href="{% url 'new_seminar' %}" class="nav-link px-2">Create Seminar</a></li>
        <li><a href="{% url 'seminar_list' %}" class="nav-link px-2">Seminar List</a></li>
        <!--<li><a href="#" class="nav-link px-2">FAQs</a></li>
        <li><a href="#" class="nav-link px-2">About</a></li> -->
      </ul>
      <div class="col-md-3 text-end">
        {% if user.is_authenticated %}
        <a class="nav-item me-2">{{ user.username }}</a>
        <a href="{% url 'logout' %}" class="btn btn-outline-primary">Logout</a>
        {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary">Sign-up</a>
        {% endif %}
      </div>
    </header>
  </div>
</main>
