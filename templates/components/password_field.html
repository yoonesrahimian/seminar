<div class="mb-3">
    {{ field.label_tag }}
    <div class="input-group">
        {{ field }}
        <button type="button" class="btn btn-outline-secondary" id="toggle-password">Show</button>
    </div>
    {% if field.errors %}
    <div class="invalid-feedback d-block">
        {{ field.errors.0 }}
    </div>
    {% endif %}
</div>
