{% load message_tags %}

{% if messages %}
    {% for message in messages %}
    <div class="container">
        <div class="alert alert-{{ message.tags|bootstrap_alert_class }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
{% endif %}
