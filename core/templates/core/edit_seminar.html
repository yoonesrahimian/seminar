{% extends 'base.html' %}
{% block title %}Edit Seminar{% endblock %}

{% block content %}
<div class="container">
    <div class="py-5 text-center">
          <h1 class="h2">Edit Seminar</h1>
    </div>
    <div class="col-md-7 col-lg-8 mx-auto">
      {% if seminar.image %}
      <img class="d-block mx-auto img-fluid w-50" src="{{ seminar.image.url }}">
      {% endif %}
        <form action="{% url 'core:edit_seminar' seminar.id %}" method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-2">
                {{ field.label }}
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger">
                    {{ error }}
                    </div>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 mt-4">Edit</button>
        </form>
    </div>
</div>
{% endblock %}
