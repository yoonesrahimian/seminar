{% extends 'blog/base.html' %}

{% block title %}Blog{% endblock %}

{% block content %}
<div class="container py-5">
<div class="p-4 p-md-5 mb-4 rounded text-body-emphasis bg-body-secondary">
    <div class="col-lg-6 px-0">
      <h1 class="display-4 fst-italic">{{ first_post.title }}</h1>
      <!-- <p class="lead my-3">
        Multiple lines of text that form the lede, informing new readers
        quickly and efficiently about what’s most interesting in this post’s
        contents.
      </p> -->
      <p class="lead mb-0">
        <a href="{% url 'blog:post_detail' slug=first_post.slug %}" class="text-body-emphasis fw-bold"
          >Continue reading...</a
        >
      </p>
    </div>
  </div>
  <div class="row mb-2">
    {% for post in posts %}
    <div class="col-md-6">
      <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative">
        <div class="col p-4 d-flex flex-column position-static">
          <strong class="d-inline-block mb-2 text-primary-emphasis">{{ post.category }}</strong>
          <h3 class="mb-0">{{ post.title }}</h3>
          <div class="mb-1 text-body-secondary">{{ post.created_at|date:'F j, Y' }}</div>
          <!-- <p class="card-text mb-auto">
            short description...
          </p> -->
          <a href="{% url 'blog:post_detail' slug=post.slug %}" class="icon-link gap-1 icon-link-hover stretched-link">
            Continue reading
            <svg class="bi" aria-hidden="true">
              <use xlink:href="#chevron-right"></use>
            </svg>
          </a>
        </div>
        <div class="col-auto d-none d-lg-block">
          <!-- <svg
            aria-label="Placeholder: Thumbnail"
            class="bd-placeholder-img"
            height="250"
            preserveAspectRatio="xMidYMid slice"
            role="img"
            width="200"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Placeholder</title>
            <rect width="100%" height="100%" fill="#55595c"></rect>
            <text x="50%" y="50%" fill="#eceeef" dy=".3em">Thumbnail</text>
          </svg> -->
          <img class="object-fit-cover" src="{{ post.image_url }}" alt="" height="250" width="200">
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="d-flex justify-content-center">
    <a class="btn btn-secondary w-25" href="{% url 'blog:post_list' %}">All Posts</a>
  </div>
</div>
{% endblock %}
