{% extends 'admin/base_site.html' %}

{% block content %}
<h1>Deposit to {{ wallet.user}}</h1>
<p>
    Current balance:
    <strong>{{ wallet.balance }}</strong>
</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="default" type="submit">Deposit</button>
</form>
{% endblock %}
